<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>GLB Viewer</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#141416}</style>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/three.module.min.js",
    "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const params = new URLSearchParams(location.search);
const src = params.get('src') || '/assets/models/wall-lamp.glb';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141416);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.6;
scene.add(new THREE.HemisphereLight(0xffffff, 0x222224, 0.4));

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

window.__ready = false;
window.__error = null;
new GLTFLoader().load(src, gltf => {
  const obj = gltf.scene;
  scene.add(obj);
  // frame the object
  const box = new THREE.Box3().setFromObject(obj);
  const c = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  camera.position.set(c.x + size * 0.7, c.y + size * 0.25, c.z + size * 0.9);
  controls.target.copy(c);
  controls.update();
  renderer.setAnimationLoop(() => {
    controls.update();
    renderer.render(scene, camera);
    window.__ready = true;
  });
}, undefined, err => { window.__error = String(err && err.message || err); });
</script>
</body>
</html>
