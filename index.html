<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eli3xir · 房间</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d0b09}
  #app{position:fixed;inset:0}
  #tip{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    color:#e8dcc8;font:14px/1.6 "Microsoft YaHei",sans-serif;background:rgba(20,16,12,.72);
    padding:8px 20px;border-radius:20px;pointer-events:none;transition:opacity .3s}
  #label{position:fixed;color:#ffe9c4;font:15px "Microsoft YaHei",sans-serif;
    background:rgba(30,22,14,.85);padding:5px 14px;border-radius:6px;pointer-events:none;
    display:none;transform:translate(-50%,-140%);white-space:nowrap;z-index:10}
  .nav-btn{position:fixed;background:rgba(30,22,14,.85);color:#ffe9c4;
    border:1px solid #6b5335;border-radius:8px;padding:8px 18px;cursor:pointer;
    font:14px "Microsoft YaHei",sans-serif;display:none;z-index:10}
  .nav-btn:hover{background:rgba(60,45,28,.9)}
  #back{left:24px;top:24px}
  #enter{left:24px;top:76px;border-color:#c9963c;color:#ffd9a0}
  #disc{left:24px;top:128px}
  #nowplaying{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    color:#ffd9a0;font:13px "Microsoft YaHei",sans-serif;background:rgba(20,16,12,.72);
    padding:7px 18px;border-radius:18px;display:none;z-index:10}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#e8dcc8;font:16px "Microsoft YaHei",sans-serif;background:#0d0b09;z-index:99;
    transition:opacity .6s}
  #fade{position:fixed;inset:0;background:#0d0b09;opacity:0;pointer-events:none;
    transition:opacity .5s;z-index:50}
  #brand{position:fixed;right:26px;top:24px;color:rgba(232,220,200,.55);
    font:13px/1.5 "Microsoft YaHei",sans-serif;text-align:right;pointer-events:none;z-index:10}
</style>
<script type="importmap">
{
  "imports": {
    "three": "/vendor/three/three.module.min.js",
    "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app"></div>
<div id="loading">正在进入房间…</div>
<div id="tip">移动鼠标环视房间，点击物件进入板块</div>
<div id="label"></div>
<button id="back" class="nav-btn">← 返回房间</button>
<button id="enter" class="nav-btn">进入 →</button>
<button id="disc" class="nav-btn">⏭ 切碟</button>
<div id="nowplaying"></div>
<div id="brand">eli3xir<br>3D Room Homepage</div>
<div id="fade"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0b09);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.06;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 60);
scene.add(new THREE.HemisphereLight(0x8a7a64, 0x14100c, 0.12));

/* ---------- modules (zone-based picking; imported meshes carry no names) ---------- */
const MODULES = {
  lab:      { name: '实验室', url: 'lab/',    zone: [4.7, 7.05, 0.25, 1.6, -1.2, 0.15],
              cam: [5.85, 1.4, -2.8], tgt: [5.85, 0.95, -0.5] },
  articles: { name: '文章',   url: 'blog/',   zone: [3.0, 4.7, 0.25, 1.4, -1.2, 0.15],
              cam: [3.85, 1.4, -2.8], tgt: [3.85, 0.9, -0.5] },
  radio:    { name: '电台',   url: 'radio/',  zone: [1.9, 3.0, 0.25, 2.2, -1.2, 0.15],
              cam: [2.45, 1.5, -2.4], tgt: [2.45, 1.15, -0.45] },
  about:    { name: '关于',   url: 'about/',  zone: [0.3, 2.0, 1.35, 2.55, -0.4, 0.15],
              cam: [1.15, 1.9, -2.4], tgt: [1.15, 1.9, -0.05] },
  skin:     { name: '皮肤',   url: 'skin/',  zone: [0.55, 1.85, 0.55, 1.35, -0.4, 0.15],
              cam: [1.2, 1.25, -2.2], tgt: [1.2, 1.05, -0.06] },
};
const ZONE_ORDER = ['about', 'skin', 'radio', 'articles', 'lab'];
function moduleAt(point) {
  for (const id of ZONE_ORDER) {
    const [x0, x1, y0, y1, z0, z1] = MODULES[id].zone;
    if (point.x >= x0 && point.x <= x1 && point.y >= y0 && point.y <= y1 &&
        point.z >= z0 && point.z <= z1) return id;
  }
  return null;
}

/* ---------- skins (tint presets, shared with skin/ page) ---------- */
const SKINS = {
  default: { name: '暖黄书房', colors: null }, // baked original
  brick:   { name: '砖红复古', colors: {
    wall_plaster: [0.72, 0.48, 0.38], floor_wood: [0.45, 0.26, 0.16],
    ceiling: [0.78, 0.68, 0.60], trim: [0.50, 0.38, 0.32],
    rug: [0.40, 0.18, 0.14], rug_inner: [0.58, 0.32, 0.24], cork: [0.60, 0.40, 0.24] } },
  forest:  { name: '墨绿工作室', colors: {
    wall_plaster: [0.42, 0.52, 0.42], floor_wood: [0.38, 0.26, 0.16],
    ceiling: [0.70, 0.72, 0.66], trim: [0.40, 0.44, 0.38],
    rug: [0.30, 0.34, 0.22], rug_inner: [0.44, 0.48, 0.32], cork: [0.52, 0.42, 0.24] } },
  ocean:   { name: '灰蓝夜晚', colors: {
    wall_plaster: [0.48, 0.56, 0.68], floor_wood: [0.30, 0.24, 0.20],
    ceiling: [0.62, 0.66, 0.74], trim: [0.38, 0.42, 0.50],
    rug: [0.22, 0.26, 0.36], rug_inner: [0.34, 0.40, 0.52], cork: [0.50, 0.42, 0.30] } },
  cream:   { name: '米白极简', colors: {
    wall_plaster: [0.88, 0.85, 0.78], floor_wood: [0.58, 0.46, 0.32],
    ceiling: [0.92, 0.90, 0.86], trim: [0.68, 0.62, 0.54],
    rug: [0.62, 0.52, 0.44], rug_inner: [0.74, 0.64, 0.54], cork: [0.68, 0.52, 0.34] } },
};
function applySkin(id) {
  const skin = SKINS[id] || SKINS.default;
  if (!skin.colors || !window.__scene) return;
  window.__scene.traverse(o => {
    if (o.isMesh && o.material && skin.colors[o.material.name])
      o.material.color.setRGB(...skin.colors[o.material.name]);
  });
}
const currentSkin = localStorage.getItem('room-skin') || 'default';

/* ---------- load room + lightmaps ---------- */
window.__ready = false;
window.__error = null;
const manager = new THREE.LoadingManager();
const loadingEl = document.getElementById('loading');
manager.onProgress = (url, loaded, total) => {
  loadingEl.textContent = `正在进入房间… ${Math.round(loaded / total * 100)}%`;
};
manager.onLoad = () => {
  loadingEl.style.opacity = 0;
  setTimeout(() => loadingEl.remove(), 700);
  window.__ready = true;
};
const texLoader = new THREE.TextureLoader(manager);
const lmManifest = await fetch('assets/room/lightmaps/manifest.json').then(r => r.json()).catch(() => ({}));
const lmMap = {};
for (const [k, v] of Object.entries(lmManifest)) lmMap[k.replaceAll('.', '')] = v;
const lmCache = {};
function lightmapFor(file) {
  if (!lmCache[file]) {
    const t = texLoader.load('assets/room/lightmaps/' + file);
    t.flipY = false;
    t.colorSpace = THREE.SRGBColorSpace;
    t.channel = 1;
    lmCache[file] = t;
  }
  return lmCache[file];
}
new GLTFLoader(manager).load('assets/room/room.glb', gltf => {
  scene.add(gltf.scene);
  const kill = [];
  gltf.scene.traverse(o => {
    if (o.isMesh) {
      const entry = lmMap[o.name] || lmMap[o.name.replace(/_\d+$/, '')];
      if (entry) {
        o.material = o.material.clone();
        o.material.lightMap = lightmapFor(entry.file);
        o.material.lightMapIntensity = 1.15;
      }
    }
    if (o.isLight) kill.push(o);
  });
  kill.forEach(o => o.removeFromParent());
  window.__scene = scene;
  window.__camera = camera;
  applySkin(currentSkin);
}, undefined, err => { window.__error = String(err && err.message || err); });

/* ---------- 2.5D camera rig ---------- */
const HOME = { cam: new THREE.Vector3(4, 1.62, -5.3), tgt: new THREE.Vector3(4, 1.0, -0.3) };
const PAN_X = 1.7, PAN_Y = 0.22;
let mouseX = 0, mouseY = 0, isTouch = false;
let focused = null, tween = null;
const camPos = HOME.cam.clone(), camTgt = HOME.tgt.clone();

addEventListener('pointermove', e => {
  isTouch = e.pointerType === 'touch';
  mouseX = (e.clientX / innerWidth) * 2 - 1;
  mouseY = (e.clientY / innerHeight) * 2 - 1;
});

function flyTo(cam, tgt, done) {
  tween = {
    t: 0, dur: 1.25,
    fromCam: camPos.clone(), fromTgt: camTgt.clone(),
    toCam: new THREE.Vector3(...cam), toTgt: new THREE.Vector3(...tgt),
    done,
  };
}
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* ---------- gramophone: spinning vinyl + real audio ---------- */
const SPIN_CENTER = new THREE.Vector3(2.39, 1.155, -0.45);
let spinPivot = null, spinning = false;
const deck = { playlist: null, idx: 0, el: new Audio(), fetching: false };
deck.el.preload = 'none';

const discEl = document.getElementById('disc');
const npEl = document.getElementById('nowplaying');

function attachRecord() {
  if (spinPivot || !window.__scene) return;
  spinPivot = new THREE.Group();
  spinPivot.position.copy(SPIN_CENTER);
  window.__scene.add(spinPivot);
  const box = new THREE.Box3(), c = new THREE.Vector3();
  const parts = [];
  window.__scene.traverse(o => {
    if (o.isMesh) {
      box.setFromObject(o);
      box.getCenter(c);
      if (c.distanceTo(SPIN_CENTER) < 0.09) parts.push(o);
    }
  });
  parts.forEach(o => spinPivot.attach(o));
}

async function fetchPlaylist() {
  if (deck.playlist || deck.fetching) return;
  deck.fetching = true;
  try {
    const r = await fetch('https://api.i-meto.com/meting/api?server=netease&type=playlist&id=6665470324');
    deck.playlist = await r.json();
  } catch (e) { deck.playlist = null; }
  deck.fetching = false;
}

function playDisc(i) {
  if (!deck.playlist || !deck.playlist.length) return;
  deck.idx = ((i % deck.playlist.length) + deck.playlist.length) % deck.playlist.length;
  const t = deck.playlist[deck.idx];
  deck.el.src = t.url;
  deck.el.play().catch(() => { npEl.textContent = '点击任意处开始播放'; });
  npEl.textContent = `♪ ${t.title} — ${t.author}`;
  npEl.style.display = 'block';
}

function startGramophone() {
  attachRecord();
  spinning = true;
  discEl.style.display = 'block';
  if (deck.playlist) playDisc(deck.idx);
  else fetchPlaylist().then(() => playDisc(deck.idx));
}
function stopGramophone() {
  spinning = false;
  discEl.style.display = 'none';
  npEl.style.display = 'none';
  deck.el.pause();
}
discEl.addEventListener('click', () => playDisc(deck.idx + 1));

/* ---------- picking & navigation ---------- */
const ray = new THREE.Raycaster();
const ptr = new THREE.Vector2();
const labelEl = document.getElementById('label');
const tipEl = document.getElementById('tip');
const backEl = document.getElementById('back');
const enterEl = document.getElementById('enter');
const fadeEl = document.getElementById('fade');
let hovered = null, downAt = null;

function pick(e) {
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(scene.children, true);
  for (const h of hits) {
    const id = moduleAt(h.point);
    if (id) return id;
  }
  return null;
}

addEventListener('pointermove', e => {
  if (focused || !window.__ready) return;
  hovered = pick(e);
  if (hovered) {
    labelEl.textContent = MODULES[hovered].name;
    labelEl.style.display = 'block';
    labelEl.style.left = e.clientX + 'px';
    labelEl.style.top = e.clientY + 'px';
    document.body.style.cursor = 'pointer';
  } else {
    labelEl.style.display = 'none';
    document.body.style.cursor = 'default';
  }
});

addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  if (focused || !window.__ready) return;
  const id = pick(e);
  if (id) focusModule(id);
});

function focusModule(id) {
  focused = id;
  labelEl.style.display = 'none';
  tipEl.style.opacity = 0;
  backEl.style.display = 'block';
  if (MODULES[id].url) enterEl.style.display = 'block';
  if (id === 'radio') startGramophone();
  const m = MODULES[id];
  flyTo(m.cam, m.tgt);
}
function unfocus() {
  if (focused === 'radio') stopGramophone();
  focused = null;
  tipEl.style.opacity = 1;
  backEl.style.display = 'none';
  enterEl.style.display = 'none';
  flyTo(HOME.cam.toArray(), HOME.tgt.toArray());
}
backEl.addEventListener('click', unfocus);
enterEl.addEventListener('click', () => {
  const url = focused && MODULES[focused].url;
  if (!url) return;
  fadeEl.style.opacity = 1;
  setTimeout(() => location.href = url, 520);
});
addEventListener('keydown', e => { if (e.key === 'Escape' && focused) unfocus(); });

/* ---------- loop ---------- */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (tween) {
    tween.t += dt / tween.dur;
    const k = ease(Math.min(tween.t, 1));
    camPos.lerpVectors(tween.fromCam, tween.toCam, k);
    camTgt.lerpVectors(tween.fromTgt, tween.toTgt, k);
    if (tween.t >= 1) { const d = tween.done; tween = null; d && d(); }
  } else if (!focused) {
    // desktop: view follows mouse direction; touch: natural drag (inverse)
    const dir = isTouch ? 1 : -1;
    const px = HOME.cam.x + dir * mouseX * PAN_X;
    const py = HOME.cam.y - mouseY * PAN_Y;
    camPos.x += (px - camPos.x) * 0.06;
    camPos.y += (py - camPos.y) * 0.06;
    camTgt.x += ((HOME.tgt.x + dir * mouseX * PAN_X * 1.25) - camTgt.x) * 0.06;
    camTgt.y += ((HOME.tgt.y - mouseY * 0.3) - camTgt.y) * 0.06;
  }
  camera.position.copy(camPos);
  camera.lookAt(camTgt);
  if (spinning && spinPivot) spinPivot.rotation.y += dt * 2.4;
  renderer.render(scene, camera);
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
